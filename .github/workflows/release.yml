name: Release

# When the number in VERSION changes on main, build the installer and
# publish it as release v<VERSION>. Installed copies of Phoenix AI check
# the Releases page and update themselves.
#
# You can also run it by hand from the Actions tab (Release > Run workflow).
# Pushes that don't change VERSION skip the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# Pinned to Ubuntu 24.04: that is where the NSIS package (makensis) this
# build uses is known to work.
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, so there's nothing to publish."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing v$VERSION."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./backend/

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build the app and installer
        run: ./build.sh

      - name: Write release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## / { if (p) exit; p = ($2 == v); next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Phoenix AI $VERSION" > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/PhoenixAI-Setup-$VERSION.exe" \
            "build/PhoenixAI-Setup-$VERSION.exe.sha256" \
            --target "$GITHUB_SHA" \
            --title "Phoenix AI $VERSION" \
            --notes-file notes.md
