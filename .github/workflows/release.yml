name: Release

# Push a tag like v0.2.1 (it must match the VERSION file) to build the
# installer and publish it on the Releases page. Installed copies of
# Phoenix AI check there and update themselves.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check the tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the VERSION file ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: go test ./backend/

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build the app and installer
        run: ./build.sh

      - name: Write release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## / { if (p) exit; p = ($2 == v); next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Phoenix AI $VERSION" > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/PhoenixAI-Setup-$VERSION.exe" \
            "build/PhoenixAI-Setup-$VERSION.exe.sha256" \
            --title "Phoenix AI $VERSION" \
            --notes-file notes.md
